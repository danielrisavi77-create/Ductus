<!DOCTYPE html>
<html lang="hr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ductura · dizajn v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<!-- Dizajnerska referenca, ne produkcijski kod. Vizualni sustav: Ductura_showcase_v2 (repo ductura-dizajn), odluka vlasnika 21. 10. 2026.
     (zamjenjuje D-123 u izgledu; fontovi iz app/fonts; cijela nova ljuska s bočnom navigacijom za demo).
     Pravila proizvoda: PRODUCT §5, D-80, D-118, D-142/143, D-145/146, D-154, F-108. Svi podaci izmišljeni. Samostalna datoteka.
     Svi ishodi su lokalna simulacija, bez stvarnog upisa, predaje, autentikacije, odjave ili reprodukcije rada. -->
<style>
:root{color-scheme:dark;--bg:#091310;--surface:#0e1b17;--surface2:#12211c;--surface3:#192a23;--line:#24372e;--line2:#1b2d24;--ink:#eef3e9;--muted:#a3b5aa;--faint:#80998a;--accent:#8ee3be;--accent2:#2f6d54;--accentbg:#173c2d;--amber:#e9c58b;--amberbg:#342d20;--blue:#a2c6e5;--bluebg:#1e303d;--shadow:0 22px 80px #0003;--serif:Georgia,'Times New Roman',serif;--sans:Inter,'Segoe UI',Arial,sans-serif;--radius:14px}
:root[data-theme=light]{color-scheme:light;--bg:#f3f4ee;--surface:#fff;--surface2:#f8f9f5;--surface3:#e9efe6;--line:#d4ded2;--line2:#e3e9df;--ink:#1a3026;--muted:#52685b;--faint:#657a6d;--accent:#216344;--accent2:#3c795b;--accentbg:#e2f0e5;--amber:#84602d;--amberbg:#f9efdc;--blue:#355b81;--bluebg:#e5eef7;--shadow:0 20px 70px #2335230b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
button,a{touch-action:manipulation}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
button{border:0;background:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.16;font-weight:400}
h1,h2,.serif{font-family:var(--serif);letter-spacing:-.035em}
h1{font-size:clamp(30px,3.1vw,46px)}
h2{font-size:28px}
h3{font-size:17px;font-weight:550;letter-spacing:-.02em}
small,.small{font-size:12px}
strong{font-weight:600}
svg{width:20px;height:20px;flex-shrink:0;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none;vertical-align:middle}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.accent{color:var(--accent)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.flex{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.grow{flex:1;min-width:0}
.mt{margin-top:24px}
.mt-sm{margin-top:12px}
.no-wrap{white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:600;transition:background .18s,border-color .18s,transform .18s;background:var(--surface)}
.btn:hover{background:var(--surface3);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.compact{min-height:36px;padding:6px 12px;font-size:12px}
.btn.block{width:100%}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;flex-shrink:0}
.icon-btn:hover{background:var(--surface3)}
.text-btn{color:var(--accent);font-size:13px;display:inline-flex;gap:7px;align-items:center;min-height:40px;padding:4px 0}
.text-btn:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:500;white-space:nowrap;color:var(--muted)}
.chip.green{color:var(--accent);background:var(--accentbg);border-color:transparent}
.chip.amber{color:var(--amber);background:var(--amberbg);border-color:transparent}
.chip.blue{color:var(--blue);background:var(--bluebg);border-color:transparent}
.dot{width:6px;height:6px;display:inline-block;background:currentColor;border-radius:50%;flex-shrink:0}
.brand{display:flex;gap:9px;align-items:center;font-family:var(--serif);font-size:29px;letter-spacing:-1.3px;line-height:1;min-height:44px}
.brand-mark{width:27px;height:32px;color:var(--accent)}
.brand-mark svg{width:27px;height:32px;stroke-width:1.8}
.avatar{width:37px;height:37px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accentbg);color:var(--accent);font-size:12px;letter-spacing:.03em;flex-shrink:0;border:1px solid var(--line)}
.avatar.alt{background:var(--bluebg);color:var(--blue)}
.avatar.gold{background:var(--amberbg);color:var(--amber)}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 24px;border-bottom:1px solid var(--line2)}
.panel-head h2{font-family:var(--sans);font-size:16px;font-weight:550;letter-spacing:-.02em}
.panel-body{padding:24px}
.divider{height:1px;background:var(--line2);margin:22px 0}
.form-group{display:flex;flex-direction:column;gap:8px;min-width:0}
.form-group label{font-size:12px;color:var(--muted);font-weight:600}
.input,select,textarea.form-input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:10px 13px}
select{padding-right:28px;cursor:pointer}
input::placeholder,textarea::placeholder{color:var(--faint)}
.search{position:relative;flex:1;min-width:190px}
.search svg{position:absolute;left:13px;top:14px;color:var(--faint);width:18px}
.search input{padding-left:41px}
.notice{display:flex;gap:11px;padding:15px 18px;border:1px solid var(--line);border-radius:9px;color:var(--muted);background:var(--surface2);font-size:12px}
.notice svg{color:var(--accent);margin-top:1px}
.notice p+ p{margin-top:5px}
/* Public website */
.site-header{height:92px;display:flex;align-items:center;justify-content:space-between;gap:24px;max-width:1300px;padding:0 44px;margin:auto;border-bottom:1px solid var(--line2)}
.site-nav{display:flex;gap:28px;font-size:13px;color:var(--muted)}
.site-nav a{padding:12px 0}
.site-nav a:hover{color:var(--accent)}
.site-main{max-width:1300px;margin:auto;padding:0 44px}
.hero{display:grid;grid-template-columns:1.03fr 1fr;align-items:center;gap:65px;padding:91px 0 65px;min-height:647px}
.hero h1{font-size:clamp(48px,5.2vw,72px);line-height:1.05;max-width:650px;letter-spacing:-.055em;margin:25px 0 23px}
.hero h1 em{font-weight:400;color:var(--accent)}
.hero p{font-size:16px;line-height:1.8;color:var(--muted);max-width:430px}
.hero-actions{margin-top:29px;gap:12px}
.hero-note{font-size:11px;letter-spacing:.04em;color:var(--faint);margin-top:22px;display:flex;align-items:center;gap:9px}
.overline-dot{display:inline-flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:100px;padding:7px 12px;color:var(--accent);font-size:10px;letter-spacing:.11em;text-transform:uppercase}
.hero-visual{position:relative;padding:22px 0 36px;isolation:isolate}
.hero-visual:before{content:'';position:absolute;width:450px;height:450px;border:1px solid var(--line);border-radius:50%;left:40px;top:-10px;z-index:-1;opacity:.55}
.hero-visual:after{content:'';position:absolute;width:385px;height:385px;border:1px solid var(--line);border-radius:50%;left:73px;top:23px;z-index:-1;opacity:.5}
.mini-app{background:var(--surface);border:1px solid #385347;border-radius:12px;box-shadow:var(--shadow);transform:rotate(-1deg);position:relative;width:100%;overflow:hidden}
.mini-top{padding:13px 17px;border-bottom:1px solid var(--line);font-size:11px;display:flex;justify-content:space-between;align-items:center}
.mini-logo{font-family:var(--serif);font-size:19px;color:var(--ink);letter-spacing:-.8px}
.mini-body{display:grid;grid-template-columns:103px 1fr;min-height:312px}
.mini-side{border-right:1px solid var(--line2);padding:19px 10px;color:var(--faint);font-size:9px}
.mini-side div{padding:9px 7px;margin:5px 0;border-radius:4px}
.mini-side div.active{color:var(--accent);background:var(--accentbg)}
.mini-paper{padding:25px 25px 32px}
.mini-paper .eyebrow{font-size:8px}
.mini-paper h3{font-family:var(--serif);font-size:22px;margin:10px 0 20px;line-height:1.25;font-weight:400;letter-spacing:-.03em}
.mini-paper h4{font-family:var(--serif);margin:0 0 8px;font-size:15px;font-weight:400}
.mini-lines{display:flex;flex-direction:column;gap:8px}
.mini-lines i{height:5px;background:var(--line);display:block;border-radius:3px}
.mini-lines i:nth-child(3){width:85%;background:var(--accent2)}
.mini-lines i:nth-child(5){width:70%}
.mini-comment{border:1px solid var(--line);padding:13px;margin-top:20px;border-radius:6px;font-size:10px;color:var(--muted);background:var(--surface2)}
.mini-comment strong{display:block;color:var(--accent);font-size:10px;margin-bottom:6px}
.floating-note{position:absolute;right:-16px;bottom:10px;border:1px solid #406351;background:var(--surface2);padding:13px 18px;box-shadow:var(--shadow);border-radius:9px;display:flex;gap:11px;align-items:center;font-size:12px;transform:rotate(2deg)}
.floating-note svg{color:var(--accent);width:27px;height:27px}
.floating-note small{display:block;color:var(--muted);font-size:10px}
.strip{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:23px 0;gap:20px;font-size:12px;color:var(--muted)}
.strip .institution{font-size:17px;font-family:var(--serif);color:var(--ink)}
.strip .institution small{font:10px var(--sans);color:var(--faint);display:block;letter-spacing:.13em;margin-top:4px}
.strip-item{display:flex;gap:10px;align-items:center}
.strip-item svg{color:var(--accent)}
.public-section{padding:75px 0}
.public-title{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:35px}
.public-title h2{font-size:40px;margin-top:12px;max-width:470px}
.public-title p{max-width:355px;color:var(--muted);font-size:14px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.role-block{padding:32px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.role-block h3{font-family:var(--serif);font-size:30px;font-weight:400;margin:20px 0 12px}
.role-block p{max-width:390px;color:var(--muted);font-size:14px;margin-bottom:20px}
.role-top{display:flex;justify-content:space-between;align-items:center;color:var(--accent)}
.role-top .eyebrow{color:var(--accent)}
.role-preview{border-top:1px solid var(--line2);margin-top:24px;padding-top:15px}
.role-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;color:var(--muted);font-size:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:35px}
.step-no{font:italic 38px var(--serif);color:var(--accent2);margin-bottom:20px}
.step-item h3{font-size:16px;margin-bottom:12px}
.step-item p{font-size:13px;color:var(--muted)}
.closing{border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:35px 0;gap:30px}
.closing h2{font-size:30px;max-width:630px;line-height:1.35}
.site-footer{max-width:1300px;padding:26px 44px 40px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:25px;color:var(--faint);font-size:11px}
.site-footer a{color:var(--muted)}
/* Application shell */
.sidebar{width:236px;position:fixed;inset:0 auto 0 0;background:var(--surface);border-right:1px solid var(--line);padding:25px 17px 16px;display:flex;flex-direction:column;z-index:40}
.sidebar .brand{padding:0 12px;margin-bottom:28px}
.workspace{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:29px}
.workspace-icon{font-family:var(--serif);font-size:18px;width:31px;height:35px;display:grid;place-items:center;border-radius:5px;background:var(--surface3);color:var(--accent)}
.workspace strong{font-size:12px;display:block}
.workspace small{font-size:10px;color:var(--faint)}
.nav-label{font-size:10px;letter-spacing:.13em;color:var(--faint);padding:0 12px;margin:6px 0 10px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:7px;margin-bottom:3px;font-size:13px;min-height:44px;color:var(--muted)}
.nav-item svg{width:18px;height:18px}
.nav-item:hover{color:var(--ink);background:var(--surface2)}
.nav-item.active{background:var(--accentbg);color:var(--accent)}
.nav-count{margin-left:auto;font-size:10px;background:var(--surface3);padding:1px 6px;border-radius:5px;color:var(--muted)}
.sidebar-bottom{margin-top:auto}
.sidebar-note{border:1px solid var(--line);border-radius:8px;padding:14px 12px;margin:20px 0;color:var(--faint);font-size:10px;line-height:1.7}
.sidebar-note strong{font-weight:500;color:var(--muted);display:block;font-size:11px;margin-bottom:3px}
.user-button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:12px 8px;border-top:1px solid var(--line)}
.user-button strong{font-size:12px;display:block}
.user-button small{font-size:10px;color:var(--faint);display:block}
.user-button>svg{width:15px;margin-left:auto;color:var(--faint)}
.app-area{margin-left:236px;min-height:100vh}
.app-topbar{height:76px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line2);background:var(--bg)}
.breadcrumb{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--faint)}
.breadcrumb span:last-child{color:var(--muted)}
.top-actions{display:flex;gap:12px;align-items:center}
.demo-tag{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;display:flex;gap:6px;align-items:center}
.top-actions .icon-btn{width:34px;height:34px;border-color:transparent}
.mobile-menu{display:none}
.app-content{padding:35px 36px 25px;max-width:1580px;margin:auto;animation:fadein .28s ease}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
.page-heading .eyebrow{margin-bottom:12px}
.page-heading p{color:var(--muted);font-size:13px;margin-top:11px;max-width:650px}
.page-heading .btn{flex-shrink:0}
.date-label{font-size:11px;color:var(--faint);text-align:right;margin-bottom:8px}
.hero-card{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:28px 30px;display:grid;grid-template-columns:1fr 260px;gap:30px;position:relative;overflow:hidden}
.hero-card h2{font-size:29px;line-height:1.25;max-width:570px;margin:14px 0 11px}
.hero-card p{color:var(--muted);font-size:12px;max-width:590px}
.hero-card .btn{margin-top:22px}
.hero-card-side{border-left:1px solid var(--line);padding-left:30px;display:flex;flex-direction:column;justify-content:center;gap:24px}
.mini-metric{display:flex;gap:12px}
.mini-metric svg{color:var(--faint);width:17px;height:17px;margin-top:4px}
.mini-metric strong{display:block;font-size:13px;font-weight:500;margin-bottom:3px}
.mini-metric small{color:var(--faint);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:26px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stat{padding:21px 23px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}
.stat-top svg{width:17px;color:var(--faint)}
.stat-number{font-family:var(--serif);font-size:36px;line-height:1.2;margin:9px 0 4px;letter-spacing:-.04em}
.stat small{font-size:10px;color:var(--faint)}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:23px}
.work-row{display:flex;align-items:center;gap:15px;padding:20px 23px;border-bottom:1px solid var(--line2);transition:background .18s}
.work-row:last-child{border-bottom:0}
.work-row:hover{background:var(--surface2)}
.work-symbol{width:42px;height:46px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--surface2);flex-shrink:0}
.work-symbol.gold{color:var(--amber)}
.work-row .work-title{display:block;text-align:left;font-size:13px;font-weight:500;line-height:1.4;padding:0;min-height:26px}
.work-title:hover{color:var(--accent)}
.work-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--faint);margin-top:6px;flex-wrap:wrap}
.work-side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}
.work-side small{font-size:10px;color:var(--faint)}
.arrow-link{color:var(--faint);margin-left:4px;width:28px;min-height:40px}
.arrow-link:hover{color:var(--accent)}
.segmented{display:inline-flex;gap:3px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:8px}
.segmented button{padding:8px 13px;font-size:12px;border-radius:5px;min-height:35px;color:var(--muted)}
.segmented button.active{background:var(--surface3);color:var(--ink)}
.key-values{display:grid;grid-template-columns:1fr auto;gap:17px;font-size:12px}
.key-values dt{color:var(--faint)}
.key-values dd{margin:0;color:var(--ink);text-align:right}
.requirements{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:23px 0}
.requirement{padding:21px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.requirement svg{color:var(--accent);margin-bottom:15px}
.requirement h3{font-size:14px;margin-bottom:10px}
.requirement p{font-size:12px;color:var(--muted)}
.table-scroll{overflow-x:auto}
.data-table{border-collapse:collapse;width:100%;white-space:nowrap;text-align:left}
.data-table th{padding:13px 18px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:500;color:var(--faint);background:var(--surface2);border-bottom:1px solid var(--line)}
.data-table td{padding:17px 18px;border-bottom:1px solid var(--line2);font-size:12px}
.data-table tr:last-child td{border:0}
.data-table tbody tr:hover{background:var(--surface2)}
.data-table .student-name{font-size:12px;display:block;text-align:left;padding:0}
.data-table small{font-size:10px;display:block;color:var(--faint);margin-top:3px}
.data-table .avatar{width:31px;height:31px;font-size:10px}
.data-table td .btn{font-size:11px}
.teacher-filters{display:grid;grid-template-columns:1.6fr 1.5fr .8fr 1fr;gap:12px;padding:21px}
.teacher-callout{display:flex;align-items:center;gap:20px;border:1px solid var(--line);background:var(--surface2);padding:20px 24px;border-radius:12px}
.teacher-callout h3{font-size:15px;margin-bottom:5px}
.teacher-callout p{font-size:12px;color:var(--muted)}
.teacher-callout>svg{color:var(--accent);width:28px;height:28px}
.teacher-callout .btn{margin-left:auto;flex-shrink:0}
/* Work space */
.editor-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.editor-heading .work-back{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;min-height:40px}
.editor-heading .flex{gap:9px}
.editor-heading .chip{font-size:10px}
.editor-layout{display:grid;grid-template-columns:174px minmax(0,1fr) 284px;min-height:650px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.editor-outline{background:var(--surface);border-right:1px solid var(--line2);padding:23px 12px}

  <div class="document"><div class="eyebrow">Kolegij A · Seminarski rad</div><h1>Čitanje naglas i jezični razvoj u prvim razredima</h1><div class="document-byline">Ana Babić &nbsp; / &nbsp; Fakultet političkih znanosti</div><div class="ms">${doc}</div></div>
  <div class="doc-footer"><span class="small">Prikazan je zadnji tekst koji je studentov preglednik poslao. To nije zapis rada i može kasniti ili zastati. Student vidi isti prikaz svog rada.</span></div></div>
 <aside class="editor-right"><div class="right-tabs"><button class="${S.tab==="kom"?"active":""}" onclick="S.tab='kom';render()">Komentari</button><button class="${S.tab==="sum"?"active":""}" onclick="S.tab='sum';render()">Sažetak procesa</button></div><div class="right-body">${right}</div></aside></div>`);
}


/* ---------- JAVNA POČETNA ---------- */
function javno(){
 return `<header class="site-header"><a href="#" class="brand" onclick="go('javno');return false" aria-label="Ductura, početna">${LOGO}</a>
 <nav class="site-nav" aria-label="Glavna navigacija"><a href="#kako-radi" onclick="document.getElementById('kako-radi').scrollIntoView();return false">Kako radi</a><a href="#za-koga" onclick="document.getElementById('za-koga').scrollIntoView();return false">Za studente i nastavnike</a></nav>
 <div class="flex"><button class="btn ghost compact" onclick="toast('/prijava · AAI@EduHr')">Prijava${icon("arrow")}</button></div></header>
 <main id="main" class="site-main" tabindex="-1"><section class="hero"><div><div class="overline-dot"><span class="dot"></span>Prostor za akademski rad</div>
 <h1>Svaki dobar rad<br>počinje <em>idejom.</em></h1><p>Od prve bilješke do predaje. Piši, razvijaj ideje i razgovaraj s nastavnikom uz tekst, u jednom mirnom radnom prostoru.</p>
 <div class="flex hero-actions wrap"><button class="btn primary showcase-primary" onclick="tourStart()">${icon("arrow")}Pokreni prezentaciju</button><button class="btn primary" onclick="toast('/prijava · student')">Ulaz za studente${icon("arrow")}</button><button class="btn ghost" onclick="toast('/prijava · nastavnik')">Ulaz za nastavnike</button></div>
 <div class="hero-note">${icon("leaf")} Tvoj rad. Tvoj tekst. Razgovor uz odlomak.</div></div>
 <div class="hero-visual"><div class="mini-app"><div class="mini-top"><span class="mini-logo">Ductura<span class="accent">.</span></span><span class="chip green" style="font-size:8px">${icon("pen")} Studentski prostor</span></div>
 <div class="mini-body"><div class="mini-side"><span class="eyebrow" style="font-size:7px">Moj rad</span><div class="active">01 &nbsp; Uvod</div><div>02 &nbsp; Teorijski okvir</div><div>03 &nbsp; Analiza</div><div>04 &nbsp; Zaključak</div><div style="margin-top:36px">Literatura &nbsp;↗</div></div>
 <div class="mini-paper"><div class="eyebrow">Kolegij A · nacrt</div><h3>Čitanje naglas i jezični razvoj u prvim razredima</h3><h4>1. Uvod</h4><div class="mini-lines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="mini-comment"><strong>NA &nbsp; Komentar nastavnika</strong>Navedi stranicu uz navod, prema Uputama FPZG-a.</div></div></div></div>
 <div class="floating-note">${icon("chat")}<div>Razgovor koji pomiče rad.<small>Od prve ideje, ne tek na kraju.</small></div></div></div></section>
 <section class="strip" aria-label="Ustanova"><div class="institution">Fakultet političkih znanosti<small>DEMO · SVEUČILIŠTE U ZAGREBU</small></div><span class="strip-item">${icon("pen")} Strukturirano pisanje</span><span class="strip-item">${icon("chat")} Komentar uz odlomak</span><span class="strip-item">${icon("eye")} Isti prikaz za oboje</span></section>
 <section id="za-koga" class="public-section"><div class="public-title"><div><div class="eyebrow">Dvije perspektive. Jedan prostor.</div><h2>Manje traženja.<br>Više vremena za dobar rad.</h2></div><p>Zadaci, tekst, komentari i predaja imaju svoje mjesto. Student i nastavnik vide isti rad i isti sažetak.</p></div>
 <div class="role-grid"><article class="role-block"><div class="role-top"><span class="eyebrow">01 / Za studente</span>${icon("cap")}</div><h3>Od prazne stranice<br>do jasne misli.</h3><p>Tvoji kolegiji i radovi na jednom mjestu. Prije prve rečenice znaš što se bilježi i što vidi nastavnik. Rad se sprema na uređaju i na poslužitelju.</p><button class="text-btn" onclick="go('s-pregled')">Otvori studentski prostor ${icon("arrow")}</button>
 <div class="role-preview"><div class="role-row"><span>Kolegij A · seminarski rad</span>${chip("U pisanju","green")}</div><div class="role-row"><span>Komentar uz odlomak</span><span class="accent">Novo ↗</span></div></div></article>
 <article class="role-block"><div class="role-top"><span class="eyebrow">02 / Za nastavnike</span>${icon("users")}</div><h3>Dobar razgovor<br>počinje uz tekst.</h3><p>Radovi tvojih zadataka, po prezimenu. Pratiš rad dok nastaje, ostavljaš komentar uz odlomak i tražiš doradu, bez pretraživanja pošte.</p><button class="text-btn" onclick="go('t-pregled')">Otvori nastavnički prostor ${icon("arrow")}</button>
 <div class="role-preview"><div class="role-row"><span>Babić, Ana · Zadatak 1</span>${chip("U pisanju","green")}</div><div class="role-row"><span>Sažetak procesa</span><span class="accent">Isti za oboje</span></div></div></article></div></section>
 <section id="kako-radi" class="public-section" style="padding-top:10px"><div class="public-title"><div><div class="eyebrow">Od zadatka do predaje</div><h2>Jedan prirodan tijek rada.</h2></div></div>
 <div class="steps">${[["Upiši kolegij","Kodom od nastavnika. Zatim pročitaj obavijest zadatka: rok, opseg, pravila i što se bilježi."],["Piši i razvijaj ideju","Struktura, navodi i literatura u jednom listu. Tekst se sprema na uređaju i na poslužitelju."],["Razgovaraj o radu","Nastavnik ostavlja komentar uz odlomak ili traži doradu. Odgovaraš uz isti tekst."],["Predaj s potvrdom","Prije predaje vidiš što predaješ. Nakon predaje dobivaš potvrdu s vremenom poslužitelja."]].map(([h,p],i)=>`<article class="step-item"><div class="step-no">0${i+1}</div><h3>${h}</h3><p>${p}</p></article>`).join("")}</div></section>
 <section class="closing"><h2>Ductura pokazuje kako rad nastaje.<br><span class="accent">Zaključak donosi čovjek.</span></h2><button class="btn primary" onclick="tourStart()">Isprobaj cijeli tijek${icon("arrow")}</button></section></main>
 <footer class="site-footer"><span>© Ductura · FPZG</span><span>Demo · izmišljeni podaci · nijedan stvarni osobni podatak</span><button onclick="toast('Kako Ductura radi · faza B')">Kako Ductura radi ↗</button></footer>`;
}

/* ---------- ISPIS (dokument A4) ---------- */
function sDokument(){
 const draft=vv()===1;
 const hdr=`<div class="sx-paper-header">Ductura · Kolegij A <span>PROFIL FPZG · NIJE POTVRĐEN</span></div>`;
 const ftr=`<div class="sx-paper-footer">Ana Babić · Zadatak 1: seminarski rad</div>`;
 return shell(crumb("Moji radovi","Zadatak 1","Ispis"),`<div class="editor-heading"><button class="work-back" onclick="go('s-editor')">${icon("back")}Natrag na pisanje</button>
 <div class="flex wrap"><button class="btn compact" onclick="toast('Izvoz DOCX · nakon demoa')">${icon("download")}Izvezi DOCX</button><button class="btn primary compact" onclick="window.print()">${icon("download")}Ispiši ili spremi PDF</button></div></div>`+
 heading("Ispis","Od nacrta do akademskog rada.","Isti tekst, oblikovan za ispis prema Uputama FPZG-a. Tekst mijenjaš u pisanju; ovdje vidiš prijelom stranica.")+
 `<div class="sx-document-layout"><aside class="panel sx-format-panel"><div class="panel-head"><h2>Oblik rada</h2>${icon("settings")}</div><div class="panel-body"><span class="chip amber">Profil FPZG · nije potvrđen</span><p class="small muted mt-sm">Granice iz Uputa FPZG-a treba potvrditi prije pilota (README §9.4).</p><div class="divider"></div>
 <div class="sx-profile-fact"><span>Prikaz</span><strong>A4 · akademski</strong></div><div class="sx-profile-fact"><span>Tekst</span><strong>Newsreader · prored 1,5</strong></div><div class="sx-profile-fact"><span>Struktura</span><strong>4 naslova</strong></div><div class="sx-profile-fact"><span>Opseg</span><strong>1 240 / 2 000–2 500 riječi</strong></div><div class="divider"></div>
 <div class="segmented sx-format-choice"><button class="${draft?"active":""}" onclick="setV(1)">Radni izgled</button><button class="${draft?"":"active"}" onclick="setV(0)">Akademski</button></div>
 <h3 class="mt">Prije ispisa</h3><button class="sx-finding" onclick="go('s-editor')"><strong>Zaključak još nije napisan</strong><span>Poglavlje 4 je prazno. Ispis je moguć i ovako.</span></button><button class="sx-finding" onclick="go('s-editor')"><strong>1 navod bez stranice</strong><span>Autor A, 2019b, u odlomku 2.</span></button></div></aside>
 <div class="sx-document-scroll ${draft?"sx-draft-style":""}" id="sx-paper-pages">
 <section class="sx-paper sx-cover">${hdr}<div class="sx-cover-institution">SVEUČILIŠTE U ZAGREBU<br><strong>Fakultet političkih znanosti</strong></div><div class="sx-cover-main"><p>Ana Babić</p><h1>Čitanje naglas i jezični razvoj u prvim razredima</h1><p class="sx-cover-type">Seminarski rad · Kolegij A</p><div class="sx-cover-rule"></div><p>Nastavnik: Nastavnik A</p></div><div class="sx-cover-bottom">Zagreb, 2026.<br><small>Demo · izmišljeni podaci.</small></div>${ftr}</section>
 <section class="sx-paper sx-toc-page">${hdr}<h2>Sadržaj</h2><div class="sx-toc">${["Uvod","Teorijski okvir","Analiza","Zaključak","Literatura"].map((t,i)=>`<a href="#"><span>0${i+1}</span>${t}<span>${i+3}</span></a>`).join("")}</div><p class="sx-print-note">Sadržaj se sastavlja iz naslova. Brojevi stranica ovise o završnom ispisu.</p>${ftr}</section>
 <section class="sx-paper sx-body-paper">${hdr}<h2>1. Uvod</h2>${PARAS.map(p=>`<p>${p}</p>`).join("")}<h2>2. Teorijski okvir</h2><p>Pojam jezičnog razvoja u ovom se radu shvaća u užem smislu, kao širenje rječnika i razumijevanja pročitanog.<sup class="sx-footnote-ref">1</sup></p><div class="sx-footnotes"><p><sup>1</sup> Usp. Autor B (2021: 7).</p></div>${ftr}</section>
 <section class="sx-paper sx-body-paper sx-bib-paper">${hdr}<h2>Literatura</h2><div class="sx-bibliography"><p>Autor A (2019b) <em>Naslov knjige o čitanju</em>. Zagreb: Izdavač.</p><p>Autor B (2021) Naslov članka. <em>Časopis</em>, 12(3): 1–20.</p><p>Autor C (2020) <em>Pregled istraživanja</em>. Zagreb: Izdavač.</p></div>${ftr}</section></div></div>`);
}

/* ---------- VODIČ (prezentacija) ---------- */
const TOUR=[
 ["t-novi",0,"01 / Zadatak","Nastavnik stvara kolegij i zadatak.","Naslov, rok, opseg i dopuštena uporaba alata. Popis dopuštenog može samo suziti."],
 ["t-novi",3,"02 / Kod","Kolegij dobiva kod za upis.","Nastavnik podijeli kod studentima. Nitko se ne upisuje bez njega."],
 ["s-upis",0,"03 / Upis","Student se upisuje kodom.","Velika i mala slova nisu važna. Nakon upisa vidi zadatke kolegija."],
 ["s-obavijest",0,"04 / Prije prve rečenice","Student zna što se bilježi.","Obavijest kaže što se bilježi, što se ne bilježi i što vidi nastavnik. Tek nakon potvrde piše."],
 ["s-editor",0,"05 / Pisanje","Tekst se sprema na uređaju i na poslužitelju.","Stanje spremanja uvijek kaže gdje je tekst. Bez mreže se piše dalje."],
 ["t-rad",0,"06 / Uživo","Nastavnik prati rad dok nastaje.","Prikaz uživo služi praćenju i komentarima, nikad ocjeni ni rangiranju."],
 ["t-rad",0,"07 / Komentar","Komentar uz odlomak.","Nastavnik označi tekst i ostavi komentar ili zahtjev za doradu. Student odgovara uz isti tekst."],
 ["t-radovi",0,"08 / Brz put","Radovi jednog zadatka, po prezimenu.","Četiri retka činjenica po studentu. Popis se ne može poredati po brojevima."],
 ["s-predaja",3,"09 / Predaja","Student predaje i dobiva potvrdu.","Vrijeme sa sata poslužitelja i sažetak dokumenta. Potvrda ne govori ništa o autorstvu."],
 ["s-dokument",0,"10 / Ispis","Rad spreman za ispis.","Naslovnica, sadržaj, tekst i literatura prema Uputama FPZG-a."]];
function tourStart(){S.tour=0;tourGo()}
function tourGo(){const [scr,v]=TOUR[S.tour];S.v[scr]=v;S.scr=scr;S.role=scr[0]==="t"?"teacher":"student";S.bell=false;S.menu=false;render();scrollTo(0,0)}
function tourDock(){
 if(S.tour==null) return "";
 const t=TOUR[S.tour];
 return `<aside class="sx-tour-dock" aria-label="Vođena prezentacija"><div class="sx-tour-progress">${TOUR.map((x,i)=>`<button class="${i===S.tour?"active":i<S.tour?"visited":""}" onclick="S.tour=${i};tourGo()" aria-label="Korak ${i+1}"><span>${i+1}</span></button>`).join("")}</div>
 <div class="sx-tour-copy"><span class="eyebrow">${t[2]} · izmišljeni podaci</span><strong>${t[3]}</strong><p>${t[4]}</p></div>
 <div class="sx-tour-controls"><div class="flex between"><button class="btn compact" ${S.tour?"":"disabled"} onclick="S.tour--;tourGo()">Natrag</button>${S.tour<TOUR.length-1?`<button class="btn primary compact" onclick="S.tour++;tourGo()">Sljedeće${icon("arrow")}</button>`:`<button class="btn primary compact" onclick="S.tour=null;go('javno')">Završi</button>`}<button class="btn compact" onclick="S.tour=null;render()">Izađi</button></div></div></aside>`;
}

/* ---------- dijalog odjave ---------- */
function dlg(){
 if(S.dlg!=="odjava") return "";
 return `<div class="dlg-shade" onclick="S.dlg=null;render()"></div><div class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="modal-head"><h2 id="dlg-t">Odjava</h2><button class="icon-btn" onclick="S.dlg=null;render()" aria-label="Zatvori">${icon("close")}</button></div>
 <div class="modal-body"><p>Imaš 7 izmjena spremljenih na uređaju koje još nisu na poslužitelju. Odjava zatvara sesiju.</p><p class="small muted" style="margin-top:10px">Zapis ostaje vezan uz tebe na ovom uređaju i nastavljaš ga kad se ponovno prijaviš. Osoba koja se nakon tebe prijavi na ovom uređaju ne vidi tvoj rad.</p></div>
 <div class="modal-footer"><button class="btn ghost" id="stay" onclick="S.dlg=null;render()">Ostani</button><button class="btn primary" onclick="toast('Sesija zatvorena');S.dlg=null;render()">${icon("logout")}Odjavi se</button></div></div>`;
}

/* ---------- render ---------- */
const R={"javno":javno,"s-dokument":sDokument,"s-pregled":sPregled,"s-radovi":sRadovi,"s-obavijesti":sObavijesti,"s-upis":sUpis,"s-obavijest":sObavijest,"s-editor":sEditor,"s-predaja":sPredaja,"t-pregled":tPregled,"t-kolegiji":tKolegiji,"t-novi":tNovi,"t-radovi":tRadovi,"t-rad":tRad};
function render(){
 $("#proto").innerHTML=`<b>DUCTURA · DIZAJN V3</b>`+["public","student","teacher"].map(r=>`<span class="pg">${{public:"Javno",student:"Student",teacher:"Nastavnik"}[r]}</span>`+SCR[r].map(([k,l])=>`<button aria-current="${k===S.scr}" onclick="go('${k}')">${l}</button>`).join("")).join("")+
  `<span class="pv">Stanje:</span>`+(VAR[S.scr]||[]).map((x,i)=>`<button class="vr" aria-pressed="${i===vv()}" onclick="setV(${i})">${x}</button>`).join("")+`<button class="vr" onclick="S.dlg='odjava';render()">Odjava ▸</button><button class="vr" onclick="tourStart()">Vodič ▸</button>`;
 $("#app").innerHTML=R[S.scr]();
 $("#layer").innerHTML=dlg()+tourDock();
 document.body.classList.toggle("sx-touring",S.tour!=null);
 if(S.dlg) $("#stay")?.focus();
}
addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.dlg){S.dlg=null;render()}else if(S.bell){S.bell=false;render()}}});
render();

</script>
