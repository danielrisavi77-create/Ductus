# Installed by `pnpm install` (prepare script). CI runs the same checks; the
# hooks only make failures show up before the push. Hooks live in the shared
# .git/hooks of all worktrees and call the lefthook of the current worktree.
# CI=true keeps pnpm from waiting on a prompt nobody sees inside a hook.
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,mjs}"
      env:
        CI: "true"
      run: pnpm exec eslint {staged_files}
    secrets:
      # stdin instead of `git --pre-commit`, so it also works in worktrees.
      # Without a running Docker the check is skipped with a warning; the CI
      # security job scans the full history on every push anyway.
      run: |
        if ! docker info >/dev/null 2>&1; then
          echo "lefthook secrets: Docker is not running, gitleaks skipped (CI still scans)." >&2
          exit 0
        fi
        git diff --cached | docker run -i --rm zricethezav/gitleaks:v8.30.1 stdin --redact --no-banner

pre-push:
  commands:
    typecheck:
      env:
        CI: "true"
      run: pnpm typecheck
    test:
      env:
        CI: "true"
      run: pnpm test
