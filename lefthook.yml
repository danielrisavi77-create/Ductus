# Installed by `pnpm install` (prepare script). CI runs the same checks; the
# hooks only make failures show up before the push. Hooks live in the shared
# .git/hooks of all worktrees and call the lefthook of the current worktree.
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,mjs}"
      run: pnpm exec eslint {staged_files}
    secrets:
      # stdin instead of `git --pre-commit`, so it also works in worktrees.
      run: git diff --cached | docker run -i --rm zricethezav/gitleaks:v8.30.1 stdin --redact --no-banner

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
