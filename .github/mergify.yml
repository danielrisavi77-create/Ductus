# Mergify merge queue (D-161). Mergify is a GitHub App; nothing runs on a
# developer machine. A PR enters the queue only when both statuses the gate
# publishes are green (D-161 (h)):
#   - "Engineering review gate": independent review and QA for the head;
#   - "Merge authorization": the owner's `Owner-Command: merge` comment names
#     this head (D-97, docs/ORKESTRATOR.md section 2), or the PR declares Risk
#     low or standard and touches no D-97 path.
# Mergify reads neither the PR description nor labels nor file names: the gate
# decides with the same parser that checks the declared risk, so an edited
# description cannot change what Mergify sees. A queue command is restricted
# to the owner (`sender`) and still needs every status in the queue rule.
# In the queue Mergify builds a temporary branch from `main` plus up to three
# queued PRs, waits for the CI statuses on it (DAN-240) and squashes each PR.
# A PR whose gate is green but which waits for the owner's command (Risk
# critical or a D-97 path) is kept current by Mergify (`update`, a clean merge of
# `main`, D-101): review, QA and the command carry through it, and the owner's
# command is not lost when `main` moves while the PR waits. A PR that is not in
# the gate, is a draft or has a conflict is left alone.
# Mergify reads `.mergify.yml` and `.mergify/config.yml` before this file;
# neither may exist (mergify-config.test.mjs), and Mergify applies the
# configuration of the default branch only, so a PR cannot change the queue
# before it is merged.
# scripts/engineering/mergify-config.test.mjs keeps the contexts below equal to
# the required statuses of `main` plus "Merge authorization".

queue_rules:
  - name: main
    # DAN-240: Mergify tests up to three queued PRs together on one temporary
    # branch (main plus those PRs) and runs the CI once for the batch, instead
    # of refreshing every PR with main and running the full CI one by one. The
    # PR heads stay untouched, so review, QA and the owner's command stay valid.
    batch_size: 3
    batch_max_wait_time: 2 min
    queue_conditions: &required
      - base=main
      - -draft
      - check-success=Lint, typecheck, test and build
      - check-success=Local stack (compose.yaml)
      - check-success=Security scanners
      - check-success=Dependency review
      - check-success=Engineering review gate
      - check-success=Merge authorization
    # The temporary batch branch is a PR opened by Mergify itself; the gate
    # marks both of its statuses green because each queued PR already passed them.
    merge_conditions: *required
    merge_method: squash
    update_method: merge

merge_queue:
  max_parallel_checks: 2

commands_restrictions:
  queue:
    conditions:
      - sender=danielrisavi77-create
  requeue:
    conditions:
      - sender=danielrisavi77-create

pull_request_rules:
  - name: queue when the gate and the merge authorization are green
    conditions:
      - base=main
      - -draft
      - check-success=Engineering review gate
      - check-success=Merge authorization
    actions:
      queue:
        name: main
  - name: keep a PR that waits for the owner current with main
    conditions:
      - base=main
      - -draft
      - -conflict
      - "#commits-behind>0"
      - check-success=Engineering review gate
      - -check-success=Merge authorization
    actions:
      update: {}
