# queue rule 'critical': `allow_queue_branch_edit` was removed. It was already set to `false`, the default, and the option is being retired.
# queue rule 'main': `allow_queue_branch_edit` was removed. It was already set to `false`, the default, and the option is being retired.
queue_rules:
  - name: critical
    batch_size: 2
    batch_max_wait_time: 3 min
    max_checks_retries: 0
    branch_protection_injection_mode: queue
    queue_conditions: &required
      - base=main
      - -draft
      - check-success=Lint, typecheck, test and build
      - check-success=Local stack (compose.yaml)
      - check-success=Security scanners
      - check-success=Dependency review
      - check-success=Engineering review gate
      - check-success=Merge authorization
    merge_conditions: *required
    merge_method: squash
    update_method: merge
  - name: main
    batch_size: 5
    batch_max_wait_time: 3 min
    max_checks_retries: 0
    branch_protection_injection_mode: queue
    queue_conditions: *required
    merge_conditions: *required
    merge_method: squash
    update_method: merge

merge_queue:
  mode: serial
  max_parallel_checks: 1
  reset_on_external_merge: always
  skip_intermediate_results: false

commands_restrictions:
  queue:
    conditions:
      - sender=danielrisavi77-create
  requeue:
    conditions:
      - sender=danielrisavi77-create
