name: Claude Code Review — Owner Dispatch Only
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (owner only)"
        required: true
        type: number
permissions:
  contents: read
jobs:
  claude-review:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate owner request and Claude OAuth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN must be configured before a manual review."
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          head_repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name')"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Only same-repository pull requests may be reviewed with this owner token."
            exit 1
          fi
      - name: Owner-requested advisory Claude review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Read and critically inspect only pull request #${{ inputs.pr_number }}
            in ${{ github.repository }}. Identify concrete security, correctness,
            data-loss, or authorization defects, with specific diff lines and
            a reproducible scenario. This is advisory feedback only, NOT a
            canonical Agent-Review or QA-Agent verdict. Never edit or merge
            a branch, trigger deployments, print secrets, or waive required checks.
          additional_permissions: |
            actions: read

