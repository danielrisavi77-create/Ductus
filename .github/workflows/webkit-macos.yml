name: WebKit macOS

# DAN-114 (#1040): the first Safari level. Playwright's WebKit on a macOS
# runner is closer to Safari than WebKit on Linux (ci.yml, D-108 d). The
# runner has no Docker and no Compose stack; the `webkit` project of
# playwright.config.ts needs none (first run, #1041), so it runs whole and
# leaves nothing out; it stays red until #1046 is fixed (docs/TESTING.md 2).
# Advisory: not a required status (docs/ENGINEERING_SYSTEM.md §10 keeps that
# list, .github/mergify.yml its copy).
# While #1046 is open it runs only nightly and by hand: a known red check on
# a pull request head or a push to main would fail every preflight and the
# green-main criterion of M0 without a new finding. The push and pull_request
# triggers come back with the fix of #1046.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-macos-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  webkit:
    name: WebKit E2E (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # DAN-663: WebKit cached by playwright-core version and runner image, and
      # installed by the capped script. macOS needs no system packages, so
      # PLAYWRIGHT_SKIP_DEPS drops --with-deps.
      - name: Playwright version
        id: playwright
        run: node scripts/engineering/playwright-version.mjs
      - name: Restore Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-webkit
      - name: Install WebKit
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_DEPS: "1"
        run: bash scripts/engineering/playwright-install.sh webkit
      # The whole `webkit` project with Playwright's exit code; the job summary
      # tells failures tracked in #1046 from new ones.
      - name: WebKit E2E
        env:
          E2E_NO_BUILD: "1"
        run: node scripts/engineering/webkit-macos.mjs
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-webkit-macos
          path: playwright-report/
          retention-days: 14
