name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Engineering gate unit tests
        run: node --test scripts/engineering/review-gate.test.mjs
      - run: pnpm test:property
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        env:
          E2E_NO_BUILD: "1"
        run: pnpm test:e2e

  stack:
    name: Local stack (compose.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm stack:up
      - run: pnpm test:integration
      - if: failure()
        run: docker compose logs
      - if: always()
        run: pnpm stack:down

  security:
    name: Security scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks exits 0 when git itself fails (e.g. dubious ownership), so
      # the step also fails if no commit was scanned.
      - name: Gitleaks (full history)
        shell: bash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git --redact --no-banner /repo 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          ! grep -qE '(^|[^0-9])0 commits scanned' "$RUNNER_TEMP/gitleaks.log"

      - name: zizmor (workflow audit)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/zizmorcore/zizmor:1.30.1 --min-severity medium /repo/.github/workflows

      - name: Semgrep
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.179.0 semgrep scan --config p/default --config p/typescript --error --metrics off /src

      # Ignored advisories, each with a reason and an expiry, are in osv-scanner.toml.
      - name: OSV-Scanner (lockfiles)
        run: >-
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.6.0 scan source
          --config /src/osv-scanner.toml
          --lockfile /src/pnpm-lock.yaml
          --lockfile /src/infra/fake-oidc/pnpm-lock.yaml
