name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly run on main with all three browser engines (D-108 d).
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read
  pull-requests: read

# A newer push cancels an older run only on a pull request. Every run on main
# (push or nightly) gets its own group, so none is cancelled or dropped from
# the queue (D-108 d).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only protected main code classifies a PR. The PR head is fetched as an
  # object, never checked out or executed here. Bootstrap bases without the
  # classifier use the full path; an actual classification error blocks stack.
  scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - name: Classify immutable diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] || [ "$PR_BASE_REF" != main ]; then
            echo 'profile=full' >> "$GITHUB_OUTPUT"
          elif [ ! -e scripts/engineering/ci-docs-scope.mjs ] && [ ! -L scripts/engineering/ci-docs-scope.mjs ]; then
            echo 'profile=full' >> "$GITHUB_OUTPUT"
          else
            [[ "$PR_BASE" =~ ^[a-f0-9]{40}$ && "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
            [[ -f scripts/engineering/ci-docs-scope.mjs && ! -L scripts/engineering/ci-docs-scope.mjs ]]
            git fetch --no-tags --depth=1 origin "$PR_HEAD"
            node scripts/engineering/ci-docs-scope.mjs >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Lint, typecheck, test and build
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Speed only: ESLint (content strategy, one folder per digest of
      # eslint.config.mjs and the lockfile, scripts/engineering/eslint-cached.mjs),
      # tsc incremental and Next caches.
      # A pull request saves into its own ref scope and can only restore from
      # itself or main. Never add a cache to a pull_request_target workflow.
      - name: Restore lint, typecheck and Next caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/eslint
            tsconfig.tsbuildinfo
            .next/cache
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Engineering PR metadata
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/engineering/pr-metadata-check.mjs
      - name: Unit tests (changed or full)
        env:
          # When set, run only tests reachable from the diff (vitest --changed).
          # Unset or empty runs the full unit suite.
          DUCTUS_UNIT_CHANGED: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          if [ -n "$DUCTUS_UNIT_CHANGED" ]; then
            pnpm exec vitest run --changed origin/${{ github.base_ref }} --reporter=dot || pnpm test:unit
          else
            pnpm test:unit
          fi
      - name: Engineering system unit tests
        run: shopt -s failglob; node --test scripts/engineering/*.test.mjs scripts/orchestrator/*.test.mjs
      - name: Property tests
        if: needs.scope.outputs.profile == 'full'
        run: pnpm test:property
      - name: Demo launcher and fake OIDC account tests
        if: needs.scope.outputs.profile == 'full'
        run: pnpm test:demo && pnpm test:fake-oidc
      - name: Build
        if: needs.scope.outputs.profile == 'full'
        run: pnpm build

  # Keep the required context stable; skipped/failed dependencies must never
  # silently turn it green. This job does not check out or execute PR code.
  stack:
    name: Local stack (compose.yaml)
    needs: [scope, stack-e2e, stack-login, stack-e2e-results, stack-login-results]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate stack results
        if: always()
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PROFILE: ${{ needs.scope.outputs.profile }}
          E2E_RESULT: ${{ needs.stack-e2e.result }}
          LOGIN_RESULT: ${{ needs.stack-login.result }}
          EVIDENCE_RESULT: ${{ needs.stack-e2e-results.result }}
          LOGIN_EVIDENCE_RESULT: ${{ needs.stack-login-results.result }}
        run: |
          case "$SCOPE_RESULT/$PROFILE/$E2E_RESULT/$LOGIN_RESULT/$EVIDENCE_RESULT/$LOGIN_EVIDENCE_RESULT" in
            success/full/success/success/success/success) echo 'Both isolated application stack and browser checks passed.' >> "$GITHUB_STEP_SUMMARY" ;;
            success/docs/skipped/skipped/skipped/skipped) echo 'Approved documentation-only diff: stack, DB, browser, property, demo and fake-OIDC tests and the build were skipped. Lint, typecheck, unit tests, engineering tests and security checks remain required.' >> "$GITHUB_STEP_SUMMARY" ;;
            success/tests/skipped/skipped/skipped/skipped) echo 'Approved test-only diff: stack, DB, browser, property, demo and fake-OIDC tests and the build were skipped. Lint, typecheck, unit tests, engineering tests and security checks remain required.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo 'Missing, unsuccessful or unexpected CI scope/stack result.' >&2; exit 1 ;;
          esac
      - name: Reject cancelled stack
        if: cancelled()
        run: exit 1

  # Separate hosted runners give both E2E suites their own ports and database.
  # The standard suite also retains pgTAP and integration checks.
  stack-e2e:
    name: Standard E2E and database (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    # Official images pinned by their OCI index SHA-256. Local compose defaults
    # remain unchanged. CI never pulls anonymously from Docker Hub itself; the
    # Docker Hub library images come through Google's mirror (mirror.gcr.io,
    # the same digests). ECR Public answered 429 to anonymous pulls.
    env:
      DUCTUS_POSTGRES_IMAGE: mirror.gcr.io/library/postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
      DUCTUS_OBJECTS_IMAGE: ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
      DUCTUS_MAIL_IMAGE: ghcr.io/axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
      DUCTUS_OIDC_BASE_IMAGE: mirror.gcr.io/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        with:
          persist-credentials: false
          # Include both PR merge parents for the advisory UI diff. Missing
          # objects select full; this never changes which tests execute.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - name: Restore Next cache
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: stack-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            stack-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # Browser binaries only; "Install browsers" below still runs and installs
      # the system packages (--with-deps), it skips the download on a hit.
      - name: Restore Playwright browsers
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.event_name == 'pull_request' && 'chromium' || 'all' }}
      - run: pnpm stack:up
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      # The login-callback login (db/local/auth-login.sql) gets a random
      # password per run; none lives in the repo.
      - name: Local auth login password
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "DUCTUS_AUTH_LOCAL_PASSWORD=${password}" >> "$GITHUB_ENV"
          echo "AUTH_DATABASE_URL=postgres://ductus_auth_local:${password}@127.0.0.1:54329/ductus" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - name: pgTAP (pg_prove)
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        run: pnpm test:db
      # Exercise the P7 setup path after pgTAP's isolated fixtures; it seeds
      # only the local institutions before integration and E2E tests.
      - run: pnpm demo:prepare
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - run: pnpm test:integration
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - run: pnpm build
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      # Owner decision D-108 d: Chromium (desktop and mobile viewport) on a
      # pull request; Chromium, Firefox and WebKit on main and nightly.
      - name: Install browsers
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        env:
          ALL_ENGINES: ${{ github.event_name != 'pull_request' }}
          PLAYWRIGHT_TRY_WITHOUT_DEPS: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          if [ "$ALL_ENGINES" = "true" ]; then
            bash scripts/engineering/playwright-install.sh chromium firefox webkit
          else
            bash scripts/engineering/playwright-install.sh chromium
          fi
      - name: UI pilot expected test inventory
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        env:
          ALL_ENGINES: ${{ github.event_name != 'pull_request' }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: .ci-reports/ui-pilot-inventory.json
        run: |
          mkdir -p .ci-reports
          if [ "$ALL_ENGINES" = "true" ]; then
            pnpm exec playwright test --list --reporter=json
          else
            pnpm exec playwright test --list --reporter=json --project=desktop --project=mobile
          fi
      - name: E2E tests
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        env:
          E2E_NO_BUILD: "1"
          UI_TEST_PILOT: "1"
          E2E_SHARD: ${{ matrix.shard }}
          ALL_ENGINES: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$ALL_ENGINES" = "true" ]; then
            pnpm test:e2e --shard="$E2E_SHARD/3"
          else
            pnpm test:e2e --project=desktop --project=mobile --shard="$E2E_SHARD/3"
          fi
      - name: Collect shard evidence
        if: ${{ needs.scope.outputs.profile == 'full' && !cancelled() }}
        run: cp test-results/ui-pilot-full.json .ci-reports/results.json
      - name: Upload shard evidence
        if: ${{ needs.scope.outputs.profile == 'full' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: .ci-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      # Screenshots (desktop and mobile), videos and failure traces for the PR.
      - name: Upload Playwright report
        if: ${{ needs.scope.outputs.profile == 'full' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
      - if: ${{ needs.scope.outputs.profile == 'full' && failure() }}
        run: docker compose logs
      - if: ${{ needs.scope.outputs.profile == 'full' && always() }}
        run: pnpm stack:down
      - name: Reject cancelled stack
        if: cancelled()
        run: exit 1

  # Reconcile the exact test/browser inventory before the required stack status.
  # This is an ordinary read-only CI job, never the privileged review gate.
  stack-e2e-results:
    name: Standard E2E inventory
    needs: [scope, stack-e2e]
    if: ${{ always() && !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Both parents are needed by the advisory UI pilot.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: e2e-shard-*
          path: .ci-reports/shards
      - name: Verify complete E2E inventory
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/engineering/e2e-shards.mjs
      - name: UI test selection pilot
        if: ${{ needs.scope.outputs.profile == 'full' && !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/engineering/ui-test-pilot.mjs
      - name: Upload combined E2E evidence
        if: ${{ needs.scope.outputs.profile == 'full' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-combined-evidence
          path: |
            playwright-report/ui-test-pilot.json
            test-results/ui-pilot-full.json
          if-no-files-found: error
          retention-days: 14

  # Each shard is its own runner with its own stack and database, so the
  # shared demo account stays one worker per database (playwright.login.config.ts).
  stack-login:
    name: Login E2E (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    env:
      DUCTUS_POSTGRES_IMAGE: mirror.gcr.io/library/postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
      DUCTUS_OBJECTS_IMAGE: ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
      DUCTUS_MAIL_IMAGE: ghcr.io/axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
      DUCTUS_OIDC_BASE_IMAGE: mirror.gcr.io/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - name: Restore login Next cache
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: stack-login-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            stack-login-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Restore Playwright browsers
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium
      - run: pnpm stack:up
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - name: Local auth login password
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "DUCTUS_AUTH_LOCAL_PASSWORD=${password}" >> "$GITHUB_ENV"
          echo "AUTH_DATABASE_URL=postgres://ductus_auth_local:${password}@127.0.0.1:54329/ductus" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - run: pnpm demo:prepare
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
      - name: Install login browser
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        env:
          PLAYWRIGHT_TRY_WITHOUT_DEPS: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: bash scripts/engineering/playwright-install.sh chromium
      # The full login through "Demo prijava" needs `next dev` (D-09 refuses
      # the fake provider in production); Chromium only (owner decision).
      # The full suite as this runner sees it, before sharding; the inventory
      # job checks that the two shards ran exactly this.
      - name: Login E2E inventory
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .ci-reports/inventory.json
        run: pnpm exec playwright test --config playwright.login.config.ts --list --reporter=json
      - name: Full login E2E
        if: success() && !cancelled() && needs.scope.outputs.profile == 'full'
        env:
          LOGIN_E2E_JSON: .ci-reports/results.json
          LOGIN_SHARD: ${{ matrix.shard }}
        run: pnpm test:e2e:login --shard="$LOGIN_SHARD/3"
      - name: Upload login shard evidence
        if: ${{ needs.scope.outputs.profile == 'full' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: login-shard-${{ matrix.shard }}
          path: .ci-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload login Playwright report
        if: ${{ needs.scope.outputs.profile == 'full' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-login-${{ matrix.shard }}
          path: playwright-report-login/
          retention-days: 14
      - if: ${{ needs.scope.outputs.profile == 'full' && failure() }}
        run: docker compose logs
      - if: ${{ needs.scope.outputs.profile == 'full' && always() }}
        run: pnpm stack:down
      - name: Reject cancelled stack
        if: cancelled()
        run: exit 1

  # Reconcile the login shards with the full login suite before the required
  # stack status. An ordinary read-only CI job, never the privileged gate.
  stack-login-results:
    name: Login E2E inventory
    needs: [scope, stack-login]
    if: ${{ always() && !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: login-shard-*
          path: .ci-reports/login
      - name: Verify complete login E2E inventory
        run: node scripts/engineering/login-shards.mjs

  security:
    name: Security scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks exits 0 when git itself fails (e.g. dubious ownership), so
      # the step also fails if no commit was scanned.
      - name: Gitleaks (full history)
        shell: bash
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner /repo 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          ! grep -qE '(^|[^0-9])0 commits scanned' "$RUNNER_TEMP/gitleaks.log"

      # The normal default-rules scan above remains unchanged. This negative
      # control checks that the scanner actually rejects a synthetic finding,
      # rather than merely returning nonzero because image/startup failed.
      - name: Gitleaks synthetic negative smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/ductus-gitleaks-negative.XXXXXX")"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/repo" "$root/reports"
          git -C "$root/repo" init -q
          printf '%s\n' "DCT_SYNTH_LEAK_0123456789ABCDEF" > "$root/repo/fixture.txt"
          git -C "$root/repo" add fixture.txt
          git -C "$root/repo" -c user.name=CI -c user.email=ci@example.invalid \
            commit -qm "Synthetic detector negative control"
          cat > "$root/gitleaks.toml" <<'TOML'
          title = "Ductus synthetic scanner self-test"
          [[rules]]
          id = "ductus-synthetic-secret"
          description = "CI-only synthetic finding, never a real secret"
          regex = '''DCT_SYNTH_LEAK_[0-9A-F]{16}'''
          TOML
          if docker run --rm --user "$(id -u):$(id -g)" \
              -v "$root/repo:/repo:ro" \
              -v "$root/reports:/reports" \
              -v "$root/gitleaks.toml:/gitleaks.toml:ro" \
              ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
              git --config /gitleaks.toml --redact --no-banner \
              --report-format json --report-path /reports/leaks.json /repo
          then
            echo "::error::Gitleaks missed the synthetic finding"
            exit 1
          fi
          python3 - "$root/reports/leaks.json" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  findings = json.load(stream)
          except Exception as exc:
              sys.exit("Scanner failed before producing a report: " + repr(exc))
          if not isinstance(findings, list) or not any(
              finding.get("RuleID") == "ductus-synthetic-secret" for finding in findings
          ):
              sys.exit("Synthetic finding missing from report")
          print("Gitleaks synthetic rejection path verified")
          PY

      - name: zizmor (workflow audit)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 --min-severity medium /repo/.github/workflows

      - name: Semgrep
        run: docker run --rm -v "$PWD:/src" mirror.gcr.io/semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b semgrep scan --config p/default --config p/typescript --error --metrics off /src

      # Ignored advisories, each with a reason and an expiry, are in osv-scanner.toml.
      - name: OSV-Scanner (lockfiles)
        run: >-
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa scan source
          --config /src/osv-scanner.toml
          --lockfile /src/pnpm-lock.yaml
          --lockfile /src/infra/fake-oidc/pnpm-lock.yaml
