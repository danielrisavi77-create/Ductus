name: Engineering gate review signal

# Unprivileged relay (#128): a submitted, edited or dismissed PR review only
# wakes "Engineering review gate" on its completion, and the gate runs the
# default-branch definition. No checkout, no code, no permissions.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  signal:
    name: Review signal
    runs-on: ubuntu-latest
    steps:
      - name: Signal the engineering gate
        run: echo "PR review event; the engineering gate re-evaluates from the default branch."
