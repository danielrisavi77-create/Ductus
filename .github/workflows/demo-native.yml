name: Demo native

# DAN-324 (#799): the demo runner without Docker, on the Windows it is made
# for. Docker is stopped first, so every step below proves the runner alone.
# Not a required status (docs/ENGINEERING_SYSTEM.md §10 keeps its list).
on:
  pull_request:
    paths:
      - "scripts/demo/**"
      - "db/local/**"
      - "db/migrations/**"
      - "infra/fake-oidc/**"
      - ".github/workflows/demo-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Demo native (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stop Docker
        run: |
          Stop-Service -Name docker -Force -ErrorAction SilentlyContinue
          docker info 2>$null
          if ($LASTEXITCODE -eq 0) { throw "docker still answers" }
          exit 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir infra/fake-oidc install --frozen-lockfile
      - name: Local auth login password
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "DUCTUS_AUTH_LOCAL_PASSWORD=${password}" >> "$GITHUB_ENV"
          echo "AUTH_DATABASE_URL=postgres://ductus_auth_local:${password}@127.0.0.1:54329/ductus" >> "$GITHUB_ENV"
      # From an empty %LOCALAPPDATA%\Ductus: download, verify, initdb, migrate.
      - run: pnpm demo:up:native --prepare-only
      # The second run changes nothing and must succeed as well.
      - run: pnpm demo:up:native --prepare-only
      - name: Install login browser
        shell: bash
        run: bash scripts/engineering/playwright-install.sh chromium
      - name: Login E2E against the native runner
        env:
          E2E_REUSE_SERVER: "1"
        run: |
          $logs = Join-Path $env:RUNNER_TEMP "native-runner"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $runner = Start-Process -FilePath node -ArgumentList "scripts/demo/native/up.mjs","--no-demo-data" -NoNewWindow -PassThru `
            -RedirectStandardOutput (Join-Path $logs "stdout.log") -RedirectStandardError (Join-Path $logs "stderr.log")
          $ready = $false
          for ($i = 0; $i -lt 120 -and -not $runner.HasExited; $i++) {
            try { Invoke-WebRequest -Uri http://localhost:3000/ -UseBasicParsing -TimeoutSec 10 | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $ready) { pnpm demo:up:native --stop; throw "the native app did not answer on port 3000" }
          pnpm exec playwright test --config playwright.login.config.ts login sign-out shell-sign-out prijava session-and-panels submission
          $code = $LASTEXITCODE
          pnpm demo:up:native --stop
          exit $code
      - name: Full runner twice, with demo data
        run: |
          for ($round = 1; $round -le 2; $round++) {
            $runner = Start-Process -FilePath node -ArgumentList "scripts/demo/native/up.mjs" -NoNewWindow -PassThru
            $status = 0
            for ($i = 0; $i -lt 120 -and -not $runner.HasExited; $i++) {
              try { $status = (Invoke-WebRequest -Uri http://localhost:3000/ -UseBasicParsing -TimeoutSec 10).StatusCode; break } catch { Start-Sleep -Seconds 5 }
            }
            pnpm demo:up:native --stop
            if ($status -ne 200) { throw "round ${round}: GET / gave ${status}" }
          }
      - name: No process is left behind
        run: |
          $left = @(Get-Process -Name postgres, rustfs -ErrorAction SilentlyContinue)
          $left += @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.CommandLine -match 'fake-oidc|next' })
          if ($left.Count -gt 0) { $left | Format-List; throw "processes left behind" }
      - name: Upload login Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-login-native
          path: playwright-report-login/
          retention-days: 14
      - name: Upload native logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-logs
          path: |
            ${{ runner.temp }}/native-runner/
            ~/AppData/Local/Ductus/native-data/logs/
          retention-days: 7
