name: Engineering review gate

# Review/QA/override events are trusted because these workflows are loaded from
# the default branch. The workflow never checks out PR code and writes only a
# commit status on the PR head.
on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: engineering-gate-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate independent review policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/engineering/review-gate.mjs
