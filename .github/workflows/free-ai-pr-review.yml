name: Advisory free AI PR review

# Privileged event, but NEVER checks out or executes PR code.
on: # zizmor: ignore[dangerous-triggers] trusted default-branch read-only analysis; PR code is never checked out or executed
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: advisory-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advisory-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Inspect PR patch and write advisory report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/engineering/free-ai-pr-review.mjs
