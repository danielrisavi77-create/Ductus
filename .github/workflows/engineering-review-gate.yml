name: Engineering review gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: engineering-gate-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    # issue_comment also fires on ordinary issues. Only run for PR comments.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    name: Engineering review gate
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR event
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "event_path=$EVENT_PATH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER="$(jq -r '.issue.number' "$EVENT_PATH")"
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull_request_event.json"
          jq -n --slurpfile pr "$RUNNER_TEMP/pull_request_event.json" '{"pull_request": $pr[0]}' > "$RUNNER_TEMP/normalized_event.json"
          echo "event_path=$RUNNER_TEMP/normalized_event.json" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check engineering metadata and independent gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ steps.resolve.outputs.event_path }}
        run: node scripts/check-engineering-gate.mjs
