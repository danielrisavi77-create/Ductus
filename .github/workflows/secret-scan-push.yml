name: Secret scan on push

# F-017: every pushed branch is public at once, also without a pull request.
# CI ("Security scanners") scans main and pull requests; this scans every
# other branch on push. The workflow comes from the pushed branch itself, so
# it is a check for honest mistakes (a skipped local scan), not a gate.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (pushed branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same image and checks as the full-history scan in ci.yml: gitleaks
      # exits 0 when git itself fails, so the step also fails if no commit
      # was scanned.
      - name: Gitleaks (full history)
        shell: bash
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner /repo 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          ! grep -qE '(^|[^0-9])0 commits scanned' "$RUNNER_TEMP/gitleaks.log"
