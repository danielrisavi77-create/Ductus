reason = "minimatch 10.2.6 (@typescript-eslint/typescript-estree) and 3.1.5 (eslint and its plugins), dev-only. Fixed only in 11.0.1: a major jump for 10.x (latest typescript-estree needs ^10.2.2), and 3.1.5 is the last 3.x, without the vulnerable firstPhasePreProcess. That code needs optimizationLevel >= 2, which only glob sets, and glob left the lockfile with Storybook; the patterns come from our own lint config, never user input. Re-check by ignoreUntil."
