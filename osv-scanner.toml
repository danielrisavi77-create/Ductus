# Every entry needs a reason and an expiry; an expired entry fails CI again.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-03
reason = "braces has no fixed release. Dev-only, through eslint-config-next (fast-glob); not in the production bundle, and it only expands glob patterns from our own lint config, never user input. Re-check by ignoreUntil."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-01-03
reason = "glob 13.0.6, dev-only: @storybook/nextjs-vite > @storybook/react-vite > @joshwooding/vite-plugin-react-docgen-typescript. Fixed only in 14.0.2, a major jump the latest plugin (^13.0.6) does not allow, under a Storybook plugin CI never builds. Needs an AbortSignal; the plugin only calls globSync, without one, on config patterns from our own repo, never user input. Re-check by ignoreUntil."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-03
reason = "minimatch 10.2.6 (@typescript-eslint/typescript-estree, glob) and 3.1.5 (eslint and its plugins), dev-only. Fixed only in 11.0.1: a major jump for 10.x (latest typescript-estree needs ^10.2.2), and 3.1.5 is the last 3.x, without the vulnerable firstPhasePreProcess. That code needs optimizationLevel >= 2, set only by glob, and takes patterns from our own lint and Storybook config, never user input. Re-check by ignoreUntil."
