# Local and CI environment only; never deployed. Production services are
# decided in docs/BACKEND.md (D-08). Every port binds to 127.0.0.1 and every
# credential below is a local-only value.
name: ductus

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ductus
      POSTGRES_PASSWORD: ductus-local-only
      POSTGRES_DB: ductus
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ductus -d ductus"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible stand-in for the private bucket. MinIO no longer publishes
  # container images; the app reaches storage only through its S3 interface,
  # so swapping this service is a configuration change.
  objects:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ductus-local
      RUSTFS_SECRET_KEY: ductus-local-only
    command: ["/data"]
    ports:
      - "127.0.0.1:9100:9000"
    # Anonymous listing must be refused (403); any HTTP answer means it is up.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/"]
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # "Demo prijava": fake OIDC provider (D-09 allows it only locally and in CI).
  oidc:
    build: infra/fake-oidc
    environment:
      ISSUER: http://localhost:8090
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/.well-known/openid-configuration"]
      interval: 2s
      timeout: 3s
      retries: 30
