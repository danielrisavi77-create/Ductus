# Local and CI environment only; never deployed. Production services are
# decided in docs/BACKEND.md (D-08). Every port binds to 127.0.0.1 and every
# credential below is a local-only value.
# Image defaults are the digest-pinned images CI sets in ci.yml (F-017;
# scripts/engineering/compose-pins.test.mjs keeps them equal).
name: ductus

services:
  # PostgreSQL 17.11 with pgTAP and pg_prove (infra/postgres) for `pnpm test:db`.
  postgres:
    build:
      context: infra/postgres
      args:
        POSTGRES_BASE_IMAGE: ${DUCTUS_POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3}
    environment:
      POSTGRES_USER: ductus
      POSTGRES_PASSWORD: ductus-local-only
      POSTGRES_DB: ductus
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./db/tests:/db/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ductus -d ductus"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible stand-in for the private bucket. MinIO no longer publishes
  # container images; the app reaches storage only through its S3 interface,
  # so swapping this service is a configuration change.
  objects:
    image: ${DUCTUS_OBJECTS_IMAGE:-ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff}
    environment:
      RUSTFS_ACCESS_KEY: ductus-local
      RUSTFS_SECRET_KEY: ductus-local-only
    command: ["/data"]
    ports:
      - "127.0.0.1:9100:9000"
    # Ready only when the S3 layer refuses anonymous listing (403). A 503 or
    # no answer means it is not yet taking requests, so --wait holds the stack.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ | grep -qx 403"]
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    image: ${DUCTUS_MAIL_IMAGE:-ghcr.io/axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48}
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # "Demo prijava": fake OIDC provider (D-09 allows it only locally and in CI).
  oidc:
    build:
      context: infra/fake-oidc
      args:
        OIDC_BASE_IMAGE: ${DUCTUS_OIDC_BASE_IMAGE:-mirror.gcr.io/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1}
    environment:
      ISSUER: http://localhost:8090
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/.well-known/openid-configuration"]
      interval: 2s
      timeout: 3s
      retries: 30
